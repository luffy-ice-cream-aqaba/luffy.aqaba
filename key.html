<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LUFFY • لوفي | كابتن السعادة</title>
  
  <!-- خطوط النخبة العالمية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Readex+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-ar: 'Readex Pro', system-ui, sans-serif;
      --font-en: 'Plus Jakarta Sans', system-ui, sans-serif;
      --brand-red: #ff2a5f;
      --brand-gold: #f59e0b;
      --insta-grad: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font-ar);
      background: radial-gradient(circle at 50% 20%, #261410 0%, #0d0806 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }

    .smart-card-box {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(254, 215, 170, 0.35);
      border-radius: 32px;
      padding: 36px 24px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 30px rgba(245, 158, 11, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }

    @keyframes popEntrance {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .straw-hat-badge {
      position: relative;
      width: 76px;
      height: 76px;
      margin-bottom: 12px;
    }

    .hat-glow {
      position: absolute;
      width: 150%;
      height: 150%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.7) 0%, transparent 70%);
      filter: blur(14px);
    }

    .straw-hat-svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 6px 14px rgba(217, 119, 6, 0.45));
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .name-en {
      font-family: var(--font-en);
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, var(--brand-red) 0%, var(--brand-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 12px;
      color: #fed7aa;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .btn-insta-forward {
      width: 100%;
      background: var(--insta-grad);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-family: var(--font-ar);
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(253, 29, 29, 0.35);
      margin-bottom: 10px;
      transition: transform 0.2s ease;
    }
    .btn-insta-forward:active { transform: scale(0.98); }

    .btn-menu-forward {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 13px;
      border-radius: 16px;
      font-family: var(--font-ar);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-menu-forward:hover { background: rgba(255, 255, 255, 0.15); border-color: #fed7aa; color: #fed7aa; }

    /* شريط العد التنازلي البصري */
    .redirect-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 16px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--brand-red), var(--brand-gold));
      animation: fillProgress 1.8s linear forwards;
    }
    @keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }

    .redirect-hint-bar {
      margin-top: 10px;
      font-size: 10.5px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .loading-pulse-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--brand-gold);
      animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }
  </style>
</head>
<body>

  <div class="smart-card-box">
    <div class="straw-hat-badge">
      <div class="hat-glow"></div>
      <svg class="straw-hat-svg" viewBox="0 0 100 100" fill="none">
        <ellipse cx="50" cy="70" rx="46" ry="13" fill="#EAB308"/>
        <path d="M24 67C24 38 31 24 50 24C69 24 76 38 76 67Z" fill="#FACC15"/>
        <path d="M23.5 64.5C34 68.5 66 68.5 76.5 64.5C75.5 57.5 74.5 53 74.5 53C63 57.5 37 57.5 25.5 53Z" fill="#FF2A5F"/>
      </svg>
    </div>

    <div class="brand-title">
      <span class="name-en">LUFFY</span> • <span>لوفي</span>
    </div>
    <div class="tagline">كابتن السعادة • بوظة طبيعية 100% • العقبة 🇯🇴</div>

    <!-- زر الإنستغرام الفوري -->
    <a href="https://www.instagram.com/luffy.aqaba" id="insta-link-btn" class="btn-insta-forward">
      <svg style="width:18px; height:18px; fill:currentColor;" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      <span>متابعة إنستغرام لوفي</span>
    </a>

    <!-- رابط منيو الزبائن للطلب -->
    <a href="index.html" id="menu-link-btn" class="btn-menu-forward">
      <svg style="width:16px; height:16px; fill:currentColor;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/></svg>
      <span>تصفح قائمة كابتن السعادة للطلب</span>
    </a>

    <div class="redirect-progress-bar" id="progress-bar-wrap">
      <div class="progress-fill"></div>
    </div>

    <div class="redirect-hint-bar" id="redirect-hint">
      <div class="loading-pulse-dot"></div>
      <span id="hint-text">جاري التحويل لإنستغرام تلقائياً... (انقر للإلغاء)</span>
    </div>
  </div>

  <script>
    // ⚡ الرابط المركزي السحابي المعتمد
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxYmpfN2OBW24M-sumyx8dwbkFN-RsbiWkYJZYa0gZLfMxVpXr2TswzORV0inmu5nFieQ/exec";
    let INSTAGRAM_URL = "https://www.instagram.com/luffy.aqaba";

    // 1. استخراج كود بطاقة الموظف من الرابط وتسجيل المسحة آلياً في شيت الأمان
    const urlParams = new URLSearchParams(window.location.search);
    const staffToken = urlParams.get('t') || urlParams.get('token');

    if (staffToken) {
      const pingScript = document.createElement("script");
      pingScript.src = `${APPS_SCRIPT_EXEC_URL}?action=track_card_scan&token=${encodeURIComponent(staffToken)}&_ts=${Date.now()}`;
      document.body.appendChild(pingScript);
    }

    // 2. مؤقت التحويل الذكي التلقائي لإنستغرام (1.8 ثانية)
    let isRedirectCancelled = false;
    let redirectTimer = setTimeout(() => {
      if (!isRedirectCancelled) {
        window.location.href = INSTAGRAM_URL;
      }
    }, 1800);

    // إلغاء التحويل إذا تفاعل الزبون مع الصفحة أو ضغط على المنيو
    function cancelAutoRedirect() {
      if (isRedirectCancelled) return;
      isRedirectCancelled = true;
      clearTimeout(redirectTimer);
      const hint = document.getElementById('hint-text');
      if (hint) hint.textContent = "تم إيقاف التحويل التلقائي • مرحباً بك في لوفي!";
      const bar = document.getElementById('progress-bar-wrap');
      if (bar) bar.style.display = 'none';
    }

    document.getElementById('menu-link-btn').addEventListener('click', cancelAutoRedirect);
    document.querySelector('.smart-card-box').addEventListener('click', cancelAutoRedirect);
  </script>
</body>
</html>
