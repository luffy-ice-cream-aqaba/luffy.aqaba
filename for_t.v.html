<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LUFFY • لوفي | كابتن السعادة</title>
  
  <!-- خطوط النخبة العالمية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-ar: 'Readex Pro', system-ui, sans-serif;
      --font-en: 'Plus Jakarta Sans', system-ui, sans-serif;

      --theme-color: #ff2a5f;
      --theme-glow: rgba(255, 42, 95, 0.35);

      --bg-cream: #fffdfa;
      --surface-card: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.92);
      
      --text-espresso: #1a110d;
      --text-muted: #71625b;

      --brand-red: #ff2a5f;
      --brand-gold: #f59e0b;
      --emerald: #10b981;
      --emerald-dark: #059669;
      --amber: #d97706;
      --blue-accent: #2563eb;
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100vw; height: 100vh; height: 100dvh;
      overflow: hidden !important; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 15% 10%, #fff0f5 0%, #fff9f2 45%, #fdf4f8 100%);
      color: var(--text-espresso); font-family: var(--font-ar);
    }

    body {
      display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(6px, 1.4vh, 16px) clamp(8px, 1.8vw, 24px); position: relative;
    }

    .tabular-digits {
      font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
      font-family: var(--font-en); letter-spacing: 0.5px; display: inline-block;
    }

    .svg-icon {
      width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; flex-shrink: 0;
    }

    .ambient-backdrop-glow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85vw; height: 85vh; border-radius: 50%;
      background: radial-gradient(circle, var(--theme-glow) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(100px); pointer-events: none; z-index: 1; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header */
    header.theater-header {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: clamp(6px, 1vw, 16px); background: var(--surface-glass); backdrop-filter: blur(25px);
      border: 1.5px solid #ffffff; border-radius: 9999px;
      padding: clamp(4px, 0.7vh, 8px) clamp(8px, 1.4vw, 18px);
      box-shadow: 0 8px 25px rgba(180, 100, 120, 0.06); z-index: 50; flex-shrink: 0; width: 100%;
    }

    .header-right-brand { display: flex; align-items: center; gap: clamp(4px, 0.8vw, 8px); }

    .straw-hat-badge {
      position: relative; width: clamp(28px, 3.6vh, 40px); height: clamp(28px, 3.6vh, 40px);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hat-glow {
      position: absolute; width: 140%; height: 140%; border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.65) 0%, transparent 70%);
      filter: blur(8px); animation: hatPulse 3s infinite alternate;
    }
    @keyframes hatPulse { 0% { transform: scale(0.92); opacity: 0.5; } 100% { transform: scale(1.18); opacity: 1; } }

    .straw-hat-svg {
      width: 100%; height: 100%; position: relative; z-index: 2;
      filter: drop-shadow(0 4px 8px rgba(217, 119, 6, 0.35));
    }

    .brand-name {
      display: flex; align-items: center; gap: 4px; font-size: clamp(13px, 1.5vw, 19px); font-weight: 900; white-space: nowrap;
    }
    .name-en {
      font-family: var(--font-en); letter-spacing: 1px;
      background: linear-gradient(135deg, var(--brand-red) 0%, var(--brand-gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .name-ar { color: var(--text-espresso); }

    .header-center-status { display: flex; justify-content: center; align-items: center; min-width: 0; }
    .store-hours-pill {
      display: inline-flex; align-items: center; gap: 5px; background: #f8fafc; border: 1px solid #fed7aa;
      padding: clamp(2px, 0.4vh, 4px) clamp(6px, 0.9vw, 12px); border-radius: 9999px;
      font-size: clamp(8.5px, 0.8vw, 11px); font-weight: 800; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.05);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .store-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .open .store-dot { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
    .open { color: #065f46; }
    .closed .store-dot { background: var(--brand-red); box-shadow: 0 0 6px var(--brand-red); }
    .closed { color: #991b1b; }

    .header-left-tools { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
    .view-switch-pure-btn, .fullscreen-toggle-btn {
      display: flex; align-items: center; justify-content: center; background: #ffffff;
      border: 1.5px solid #e2e8f0; width: clamp(26px, 3.4vh, 34px); height: clamp(26px, 3.4vh, 34px);
      border-radius: 50%; color: var(--text-muted); cursor: pointer; flex-shrink: 0; transition: all 0.2s ease;
      position: relative;
    }
    .view-count-badge {
      position: absolute; top: -3px; right: -3px; background: var(--brand-red); color: #ffffff;
      font-family: var(--font-en); font-size: 8.5px; font-weight: 900; width: 14px; height: 14px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #ffffff;
    }

    .clock-pill-widget {
      display: inline-flex; align-items: center; gap: 4px; background: #ffffff; border: 1.5px solid #fed7aa;
      padding: clamp(2px, 0.4vh, 4px) clamp(6px, 0.8vw, 10px); border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.06); cursor: pointer; white-space: nowrap;
    }
    .clock-text-ltr {
      direction: ltr; display: inline-flex; align-items: baseline; font-family: var(--font-en);
      font-size: clamp(10px, 0.9vw, 12.5px); font-weight: 900; color: var(--text-espresso);
    }
    .clock-sec { color: var(--brand-red); font-size: 0.85em; margin-left: 2px; }
    .clock-ampm { font-family: var(--font-ar); font-size: 0.85em; font-weight: 800; color: var(--text-muted); margin-right: 2px; }

    /* Pickup Ticker */
    .ready-pickup-ticker-wrap {
      max-height: 0; opacity: 0; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: #ffffff; border: 1.5px solid transparent;
      border-radius: 12px; padding: 0 clamp(8px, 1vw, 12px); margin-top: 0; z-index: 45; flex-shrink: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ready-pickup-ticker-wrap.active-bar {
      max-height: 40px; opacity: 1; margin-top: 4px; padding: clamp(3px, 0.5vh, 5px) clamp(8px, 1vw, 12px);
      border-color: #6366f1; box-shadow: 0 6px 18px rgba(49, 46, 129, 0.25);
    }
    .pickup-cards-track { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .pickup-cards-track::-webkit-scrollbar { display: none; }
    .ready-order-pill {
      display: flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(254, 215, 170, 0.4); padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; white-space: nowrap;
    }
    .ready-order-pill .order-num { font-family: var(--font-en); color: #fed7aa; }

    /* Theater Stage */
    #theater-stage {
      flex: 1 1 0; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 10; padding: clamp(3px, 0.8vh, 8px) 0; overflow: hidden;
    }

    .stage-hero-layout {
      width: 100%; height: 100%; display: grid; align-items: center; position: relative;
      animation: heroFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes heroFade { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

    @media (orientation: landscape) {
      .stage-hero-layout {
        grid-template-columns: 1.1fr 1fr; gap: clamp(14px, 2.5vw, 36px); padding: 0 clamp(8px, 2vw, 24px);
      }
      .hero-text-pane { display: flex; flex-direction: column; justify-content: center; gap: clamp(4px, 1.2vh, 12px); text-align: right; }
      .hero-visual-pane { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
      .hero-desc-paragraph { font-size: clamp(11px, 1.1vw, 16px); color: var(--text-muted); line-height: 1.55; max-width: 520px; }
    }

    @media (orientation: portrait) {
      .stage-hero-layout { grid-template-rows: auto 1fr; gap: 4px; padding: 2px; }
      .hero-text-pane { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; }
      .hero-visual-pane { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
      .hero-desc-paragraph { font-size: clamp(10px, 1.15vh, 12px); color: var(--text-muted); line-height: 1.35; max-width: 92%; }
    }

    .hero-badges-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .category-tag {
      font-size: clamp(9.5px, 0.8vw, 11.5px); font-weight: 800; padding: 2px 10px; border-radius: 9999px;
      background: rgba(255, 255, 255, 0.9); border: 1.5px solid #fed7aa; color: var(--text-muted);
    }
    .fresh-tag-badge {
      background: linear-gradient(135deg, #ff1e56 0%, #ff5e7e 100%); color: #ffffff;
      font-size: clamp(9.5px, 0.8vw, 11px); font-weight: 800; padding: 2px 10px; border-radius: 9999px;
      box-shadow: 0 4px 12px rgba(255, 30, 86, 0.3);
    }

    .hero-title-ar { font-size: clamp(22px, 3.8vw, 56px); font-weight: 900; line-height: 1.08; color: var(--text-espresso); }
    .hero-title-en { font-family: var(--font-en); font-size: clamp(10.5px, 1.4vw, 19px); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 1px; }

    /* 🔮 الهالة الدائرية ثلاثية الأبعاد */
    .hero-pedestal-light {
      position: absolute; width: min(52vh, 32vw); height: min(52vh, 32vw); max-width: 420px; max-height: 420px;
      border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 25%, rgba(255, 255, 255, 0.4) 60%, rgba(255, 255, 255, 0) 80%);
      box-shadow: 0 20px 65px -10px var(--theme-glow), inset 0 0 45px rgba(255, 255, 255, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.85); z-index: 1;
      animation: pedestalBreathe 4.5s ease-in-out infinite alternate;
    }
    @keyframes pedestalBreathe {
      0% { transform: scale(0.94) rotate(0deg); opacity: 0.85; filter: drop-shadow(0 0 20px var(--theme-glow)); }
      100% { transform: scale(1.06) rotate(3deg); opacity: 1; filter: drop-shadow(0 0 45px var(--theme-glow)); }
    }

    .hero-main-ice-img {
      max-height: 86%; max-width: 86%; object-fit: contain; position: relative; z-index: 3;
      filter: drop-shadow(0 20px 32px rgba(35, 15, 20, 0.25)); animation: floatHero3D 4.5s ease-in-out infinite alternate;
    }
    @keyframes floatHero3D {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-7px) rotate(1.2deg) scale(1.015); }
      100% { transform: translateY(-12px) rotate(-1deg) scale(1.03); }
    }

    .hero-fruit-orbit-img {
      position: absolute; bottom: 4%; left: 8%; width: clamp(45px, 6.8vw, 90px); height: clamp(45px, 6.8vw, 90px);
      object-fit: contain; z-index: 4; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.2)); transform: rotate(-15deg);
    }

    /* Grid Layout */
    .balanced-theater-grid {
      display: grid; width: 100%; height: 100%; gap: clamp(6px, 1vw, 12px); align-content: stretch;
    }
    .grid-preset-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
    .grid-preset-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
    .grid-preset-8 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
    .grid-preset-16 { grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(2, 1fr); }
    .grid-preset-all { grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); grid-auto-rows: 1fr; }

    .theater-card-unit {
      background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(20px); border: 1.5px solid #ffffff;
      border-radius: clamp(10px, 1.4vw, 18px); padding: clamp(6px, 0.8vw, 10px); display: flex;
      flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
      box-shadow: 0 8px 20px -6px rgba(180, 100, 120, 0.08); min-height: 0;
    }
    .card-halo-back {
      position: absolute; top: -30%; right: -30%; width: 160%; height: 160%;
      border-radius: 50%; filter: blur(35px); opacity: 0.16; pointer-events: none;
    }
    .card-visual-center {
      position: relative; width: 100%; flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .card-main-scoop { max-height: 95%; max-width: 90%; object-fit: contain; }
    .card-fruit-sat { position: absolute; bottom: 0; left: 2px; width: clamp(24px, 3.5vw, 48px); height: clamp(24px, 3.5vw, 48px); object-fit: contain; transform: rotate(-14deg); }

    /* Royal Horizon Dock */
    .royal-horizon-wrapper {
      display: flex; justify-content: center; align-items: center; z-index: 50; flex-shrink: 0; width: 100%; margin-top: 3px;
    }
    .royal-horizon-dock {
      display: flex; align-items: center; gap: clamp(5px, 0.9vw, 10px); background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(25px); border: 1.5px solid rgba(255, 255, 255, 0.95);
      padding: clamp(3px, 0.5vh, 5px) clamp(6px, 1vw, 14px); border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(180, 100, 120, 0.07); max-width: 100%; overflow-x: auto; scrollbar-width: none;
    }
    .royal-horizon-dock::-webkit-scrollbar { display: none; }
    .dock-section-box { display: flex; align-items: center; gap: 5px; }
    .dock-label-badge {
      font-size: clamp(8.5px, 0.75vw, 10.5px); font-weight: 800; color: var(--text-muted); background: #f1f5f9;
      padding: 2px 7px; border-radius: 9999px; white-space: nowrap;
    }
    .dock-label-badge.in-kitchen { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

    .dock-flavor-pill {
      display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px;
      background: #f8fafc; border: 1.5px solid transparent; cursor: pointer; position: relative;
      overflow: hidden; transition: all 0.25s ease; white-space: nowrap;
    }
    .dock-flavor-pill.active {
      background: #ffffff; border-color: var(--brand-red); box-shadow: 0 3px 10px -2px rgba(255, 42, 95, 0.35); transform: scale(1.03);
    }
    .dock-flavor-pill.active::after {
      content: ""; position: absolute; bottom: 0; left: 0; height: 2px; background: var(--brand-red); width: 0%; animation: progressTimer 8s linear forwards;
    }
    @keyframes progressTimer { 0% { width: 0%; } 100% { width: 100%; } }
    .dock-thumb-img { width: clamp(16px, 2vh, 20px); height: clamp(16px, 2vh, 20px); object-fit: contain; }
    .dock-name-txt { font-size: clamp(9.5px, 0.8vw, 11px); font-weight: 800; color: var(--text-espresso); }
    .dock-v-divider { width: 1px; height: 16px; background: #e2e8f0; }

    /* Modals & Ambient Overlay */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100%; height: 100dvh;
      z-index: 999; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease; background: rgba(10, 8, 9, 0.45); backdrop-filter: blur(8px);
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-card-box {
      background: #ffffff; border-radius: 22px; padding: 18px 20px; width: 90%; max-width: 380px;
      border: 1.5px solid #fed7aa; box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    }
    .modal-preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .modal-preset-btn {
      background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 10px 6px; border-radius: 12px;
      font-family: var(--font-ar); font-size: 11px; font-weight: 800; cursor: pointer; text-align: center;
    }
    .modal-preset-btn.active, .modal-preset-btn:hover { background: var(--brand-red); color: #fff; border-color: var(--brand-red); }

    /* Ambient Zen Clock */
    #ambient-clock-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100%; height: 100dvh;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #fffdf8 40%, #fff0f3 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: clamp(16px, 3vh, 36px) clamp(16px, 3vw, 40px); cursor: pointer;
    }
    #ambient-clock-overlay.active { opacity: 1; pointer-events: auto; }
    .zen-digits-massive {
      direction: ltr; font-family: var(--font-en); font-size: clamp(52px, 11vw, 125px);
      font-weight: 900; color: var(--text-espresso); letter-spacing: -1px; line-height: 0.95;
      display: inline-flex; align-items: baseline; gap: 0.4vw;
    }
    .zen-sec-badge { font-size: clamp(19px, 3.2vw, 40px); color: var(--brand-red); font-weight: 800; }
  </style>
</head>
<body>

  <!-- الهالة التفاعلية المندمجة -->
  <div class="ambient-backdrop-glow" id="ambient-glow"></div>

  <!-- Header -->
  <header class="theater-header">
    <div class="header-right-brand">
      <div class="straw-hat-badge">
        <div class="hat-glow"></div>
        <svg class="straw-hat-svg" viewBox="0 0 100 100" fill="none">
          <ellipse cx="50" cy="70" rx="46" ry="13" fill="#EAB308"/>
          <path d="M24 67C24 38 31 24 50 24C69 24 76 38 76 67Z" fill="#FACC15"/>
          <path d="M23.5 64.5C34 68.5 66 68.5 76.5 64.5C75.5 57.5 74.5 53 74.5 53C63 57.5 37 57.5 25.5 53Z" fill="#FF2A5F"/>
        </svg>
      </div>

      <div class="brand-name">
        <span class="name-en">LUFFY</span>
        <span style="color:var(--brand-red);">•</span>
        <span class="name-ar">لوفي</span>
      </div>
    </div>

    <!-- حالة أوقات الدوام اللحظية -->
    <div class="header-center-status">
      <div class="store-hours-pill open" id="tv-store-hours-badge">
        <div class="store-dot"></div>
        <span id="tv-store-hours-text">نستقبلكم الآن بكل مودة ✨</span>
      </div>
    </div>

    <div class="header-left-tools">
      <button class="view-switch-pure-btn" onclick="toggleSettingsModal(true)" title="تحديد عدد العرض">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="view-count-badge" id="current-mode-num">١</span>
      </button>

      <button class="fullscreen-toggle-btn" onclick="toggleFullscreenMode()" title="ملء الشاشة">
        <svg class="svg-icon" id="fullscreen-icon-svg" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <div class="clock-pill-widget" onclick="openZenClockMode()" title="تكبير الساعة">
        <div class="clock-text-ltr">
          <span id="header-time-hm" class="tabular-digits">10:45</span>
          <span class="clock-sec tabular-digits" id="header-time-sec">:30</span>
        </div>
        <span class="clock-ampm" id="header-time-ampm">ص</span>
      </div>
    </div>
  </header>

  <!-- شريط نداء طلبات الاستلام الجاهزة في الصالة -->
  <div class="ready-pickup-ticker-wrap" id="ready-pickup-ticker">
    <div style="display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:900; color:#fed7aa;">
      <div style="width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e;"></div>
      <span>جاهز للاستلام 🛍️:</span>
    </div>
    <div class="pickup-cards-track" id="pickup-orders-track"></div>
  </div>

  <!-- مسرح العرض ثلاثي الأبعاد -->
  <main id="theater-stage"></main>

  <!-- شريط الأفق الملكي السفلي -->
  <footer class="royal-horizon-wrapper">
    <div class="royal-horizon-dock" id="royal-horizon-dock"></div>
  </footer>

  <!-- نافذة تبديل توزيع العرض -->
  <div class="modal-backdrop" id="settings-modal" onclick="toggleSettingsModal(false)">
    <div class="modal-card-box" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div style="font-size:14px; font-weight:900;">عدد وتوزيع النكهات على الشاشة</div>
        <button style="border:none; background:#f1f5f9; width:26px; height:26px; border-radius:50%; font-weight:800; cursor:pointer;" onclick="toggleSettingsModal(false)">✕</button>
      </div>

      <div class="modal-preset-grid">
        <button class="modal-preset-btn active" data-preset="1" onclick="applyDisplayPreset(1)">١ سينمائي</button>
        <button class="modal-preset-btn" data-preset="2" onclick="applyDisplayPreset(2)">٢ ثنائي</button>
        <button class="modal-preset-btn" data-preset="4" onclick="applyDisplayPreset(4)">٤ رباعي</button>
        <button class="modal-preset-btn" data-preset="8" onclick="applyDisplayPreset(8)">٨ شبكة</button>
        <button class="modal-preset-btn" data-preset="16" onclick="applyDisplayPreset(16)">١٦ موزاييك</button>
        <button class="modal-preset-btn" data-preset="999" onclick="applyDisplayPreset(999)">الكل معاً</button>
      </div>
    </div>
  </div>

  <!-- شاشة الضيافة والساعة الهادئة (Zen Clock Overlay) -->
  <div id="ambient-clock-overlay" onclick="closeZenClockMode()" title="انقر في أي مكان للعودة للمسرح">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div class="straw-hat-badge" style="width:55px; height:55px;">
        <div class="hat-glow"></div>
        <svg class="straw-hat-svg" viewBox="0 0 100 100" fill="none">
          <ellipse cx="50" cy="70" rx="46" ry="13" fill="#EAB308"/>
          <path d="M24 67C24 38 31 24 50 24C69 24 76 38 76 67Z" fill="#FACC15"/>
          <path d="M23.5 64.5C34 68.5 66 68.5 76.5 64.5C75.5 57.5 74.5 53 74.5 53C63 57.5 37 57.5 25.5 53Z" fill="#FF2A5F"/>
        </svg>
      </div>
      <div class="brand-name" style="font-size:20px;">
        <span class="name-en">LUFFY</span> • <span class="name-ar">لوفي</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;">
      <div class="zen-digits-massive">
        <span id="zen-clock-hm" class="tabular-digits">10:45</span>
        <span class="zen-sec-badge tabular-digits" id="zen-clock-sec">:30 ص</span>
      </div>
      <div style="font-size:14px; font-weight:800; color:var(--text-muted);" id="zen-hospitality-text">
        أهلاً وسهلاً بكم مع لوفي • كابتن السعادة • بوظة طبيعية 100% في العقبة 🇯🇴
      </div>
    </div>

    <div style="font-size:12px; font-weight:800; color:var(--text-muted); background:rgba(255,255,255,0.85); padding:6px 18px; border-radius:9999px;" id="zen-date-pill">...</div>
  </div>

  <script>
    // ⚡ الرابط السحابي المركزي المعتمد
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxYmpfN2OBW24M-sumyx8dwbkFN-RsbiWkYJZYa0gZLfMxVpXr2TswzORV0inmu5nFieQ/exec";
    const SWITCH_INTERVAL = 8000;
    const PICKUP_DURATION_MS = 5 * 60 * 1000;

    let flavorsList = [];
    let currentIndex = 0;
    let itemsPerView = 1;
    let autoPlayTimer = null;
    let previousPickupOrdersSet = new Set();

    // =========================================================================
    // 🍨 سحب النكهات الحية ونداءات الاستلام عبر الـ API المركزي الموحد
    // =========================================================================
    function syncFlavorsAndPickup() {
      // 1. سحب النكهات الحية وصورها الشفافة فوراً
      const cbFlv = "onTvFlavors_" + Date.now();
      window[cbFlv] = function(res) {
        if (res && res.data && res.data.length > 0) {
          flavorsList = res.data;
          updateTriggerLabel();
          buildFlavorsDock();
          renderMasterStage();
          startAutoPlay();
        }
      };
      const s1 = document.createElement("script");
      s1.src = `${APPS_SCRIPT_EXEC_URL}?action=get_flavors&callback=${cbFlv}&_ts=${Date.now()}`;
      document.body.appendChild(s1);

      // 2. سحب طلبات الاستلام الجاهزة في الصالة
      const cbOrd = "onTvOrders_" + Date.now();
      window[cbOrd] = function(res) {
        if (!res || !res.data) return;
        const now = Date.now();

        const readyPickupOrders = res.data.filter(o => {
          const isPickup = String(o.Order_Type || '').toUpperCase().includes('PICKUP');
          const status = String(o.Status || '').toUpperCase();
          const isReady = isPickup && (status === 'DISPATCHED' || status === 'IN_TRANSIT');
          if (!isReady) return false;

          const readyTime = o.Dispatched_At || o.Created_At;
          if (readyTime) {
            const diff = now - new Date(readyTime).getTime();
            if (!isNaN(diff) && diff > PICKUP_DURATION_MS) return false;
          }
          return true;
        });

        renderPickupTicker(readyPickupOrders);
      };
      const s2 = document.createElement("script");
      s2.src = `${APPS_SCRIPT_EXEC_URL}?action=get_live_orders&callback=${cbOrd}&_ts=${Date.now()}`;
      document.body.appendChild(s2);
    }

    function renderPickupTicker(orders) {
      const tickerWrap = document.getElementById('ready-pickup-ticker');
      const track = document.getElementById('pickup-orders-track');

      if (!orders || orders.length === 0) {
        tickerWrap.classList.remove('active-bar');
        track.innerHTML = "";
        previousPickupOrdersSet.clear();
        return;
      }

      let hasNewOrder = false;
      orders.forEach(o => {
        if (!previousPickupOrdersSet.has(o.Order_ID)) {
          hasNewOrder = true;
          previousPickupOrdersSet.add(o.Order_ID);
        }
      });

      if (hasNewOrder) playPickupChime();

      track.innerHTML = orders.map(o => `
        <div class="ready-order-pill">
          <span class="order-num">#${o.Order_ID}</span>
          <span>(${o.Customer_Name || 'زبون كابتن السعادة'})</span>
        </div>
      `).join('');

      tickerWrap.classList.add('active-bar');
    }

    function playPickupChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.45);
      } catch(e){}
    }

    // =========================================================================
    // 🎭 مسرح العرض ثلاثي الأبعاد وشريط الأفق الملكي
    // =========================================================================
    function buildFlavorsDock() {
      const dock = document.getElementById("royal-horizon-dock");
      dock.innerHTML = "";

      const availableItems = flavorsList.filter(f => f.Stock_State !== 'soldout');
      if (availableItems.length === 0) return;

      const group = document.createElement("div");
      group.className = "dock-section-box";
      group.innerHTML = `<div class="dock-label-badge"><span>النكهات الحية:</span></div>`;

      availableItems.forEach((item, index) => {
        const nameAR = item.Flavor_Name_AR || `نكهة ${index+1}`;
        const thumbUrl = item.Image_URL_Show || 'https://images.unsplash.com/photo-1560008511-11c63416e52d?w=100';

        const pill = document.createElement("div");
        pill.className = `dock-flavor-pill horizon-node-${index}`;
        pill.onclick = () => { currentIndex = index; renderMasterStage(); startAutoPlay(); };
        pill.innerHTML = `
          <img class="dock-thumb-img" src="${thumbUrl}" alt="">
          <span class="dock-name-txt">${nameAR}</span>
        `;
        group.appendChild(pill);
      });

      dock.appendChild(group);
    }

    function renderMasterStage() {
      if (flavorsList.length === 0) return;

      const stage = document.getElementById("theater-stage");
      stage.innerHTML = "";

      const actualCount = itemsPerView >= 999 ? flavorsList.length : Math.min(itemsPerView, flavorsList.length);
      const activeItems = [];
      for (let i = 0; i < actualCount; i++) {
        const idx = (currentIndex + i) % flavorsList.length;
        activeItems.push({ item: flavorsList[idx], index: idx });
      }

      const primaryColor = activeItems[0].item.Primary_Color || "#ff2a5f";
      document.documentElement.style.setProperty('--theme-color', primaryColor);
      document.documentElement.style.setProperty('--theme-glow', `${primaryColor}45`);

      document.querySelectorAll(".dock-flavor-pill").forEach(el => el.classList.remove("active"));
      const activePill = document.querySelector(`.horizon-node-${currentIndex}`);
      if (activePill) activePill.classList.add("active");

      // 🎬 النمط الفردي السينمائي ثلاثي الأبعاد
      if (actualCount === 1) {
        const { item } = activeItems[0];
        const nameAR = item.Flavor_Name_AR || 'نكهة لوفي';
        const nameEN = item.Flavor_Name_EN || '';
        const descAR = item.Description_AR || 'مُحضرة يومياً من مكونات طبيعية 100% بحرفية وإتقان في العقبة.';
        const category = item.Category || 'كابتن السعادة سبيشال';
        const fruitImgSrc = item.Image_URL_Fruit || '';
        const showImgSrc = item.Image_URL_Show || 'https://images.unsplash.com/photo-1560008511-11c63416e52d?w=500';

        stage.innerHTML = `
          <div class="stage-hero-layout">
            <div class="hero-text-pane">
              <div class="hero-badges-row">
                <span class="category-tag">${category}</span>
                ${item.Is_Fresh_Batch ? `<span class="fresh-tag-badge">طازج ✨️ Fresh</span>` : ''}
              </div>

              <div>
                <h1 class="hero-title-ar">${nameAR}</h1>
                <div class="hero-title-en" style="color:${primaryColor};">${nameEN}</div>
              </div>

              <p class="hero-desc-paragraph">${descAR}</p>
            </div>

            <div class="hero-visual-pane">
              <div class="hero-pedestal-light"></div>
              <img class="hero-main-ice-img" src="${showImgSrc}" alt="${nameAR}">
              ${fruitImgSrc ? `<img class="hero-fruit-orbit-img" src="${fruitImgSrc}" alt="">` : ''}
            </div>
          </div>
        `;
      } 
      // 🖼️ أنماط الشبكة والموزاييك المتزنة
      else {
        const grid = document.createElement("div");
        let presetClass = `grid-preset-${actualCount}`;
        if (actualCount === 16) presetClass = 'grid-preset-16';
        if (actualCount >= 999) presetClass = 'grid-preset-all';
        grid.className = `balanced-theater-grid ${presetClass}`;

        activeItems.forEach(obj => {
          const item = obj.item;
          const cardColor = item.Primary_Color || "#ff6b8b";
          const nameAR = item.Flavor_Name_AR || 'نكهة لوفي';
          const nameEN = item.Flavor_Name_EN || '';
          const category = item.Category || 'لوفي';
          const fruitImgSrc = item.Image_URL_Fruit || '';
          const showImgSrc = item.Image_URL_Show || 'https://images.unsplash.com/photo-1560008511-11c63416e52d?w=300';

          const card = document.createElement("div");
          card.className = "theater-card-unit";
          card.innerHTML = `
            <div class="card-halo-back" style="background:${cardColor};"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; z-index:2;">
              <span style="font-size:9px; font-weight:800; padding:1px 6px; border-radius:9999px; background:#f8fafc; color:var(--text-muted);">${category}</span>
              ${item.Is_Fresh_Batch ? `<span style="background:linear-gradient(135deg, #ff1e56, #ff5e7e); color:#fff; font-size:8.5px; font-weight:800; padding:1px 6px; border-radius:9999px;">طازج ✨️</span>` : ''}
            </div>
            <div class="card-visual-center">
              <img class="card-main-scoop" src="${showImgSrc}" alt="${nameAR}">
              ${fruitImgSrc ? `<img class="card-fruit-sat" src="${fruitImgSrc}" alt="">` : ''}
            </div>
            <div style="z-index:2; border-top:1px solid #f1f0ee; padding-top:2px; text-align:center;">
              <div style="font-size:clamp(11px, 1.1vw, 15px); font-weight:900; color:var(--text-espresso);">${nameAR}</div>
              <div style="font-family:var(--font-en); font-size:clamp(8px, 0.75vw, 10.5px); font-weight:800; color:${cardColor};">${nameEN}</div>
            </div>
          `;
          grid.appendChild(card);
        });

        stage.appendChild(grid);
      }
    }

    function startAutoPlay() {
      clearInterval(autoPlayTimer);
      autoPlayTimer = setInterval(() => {
        if (flavorsList.length > 0 && itemsPerView < flavorsList.length) {
          const step = itemsPerView >= 999 ? 1 : itemsPerView;
          currentIndex = (currentIndex + step) % flavorsList.length;
          renderMasterStage();
        }
      }, SWITCH_INTERVAL);
    }

    function applyDisplayPreset(count) {
      itemsPerView = count;
      updateTriggerLabel();
      toggleSettingsModal(false);
      renderMasterStage();
      startAutoPlay();
    }

    function updateTriggerLabel() {
      const numBadge = document.getElementById('current-mode-num');
      if (itemsPerView === 1) numBadge.textContent = '١';
      else if (itemsPerView === 2) numBadge.textContent = '٢';
      else if (itemsPerView === 4) numBadge.textContent = '٤';
      else if (itemsPerView === 8) numBadge.textContent = '٨';
      else if (itemsPerView === 16) numBadge.textContent = '١٦';
      else numBadge.textContent = '∞';

      document.querySelectorAll('.modal-preset-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.preset) === itemsPerView);
      });
    }

    function toggleSettingsModal(open) { document.getElementById('settings-modal').classList.toggle('open', open); }

    function updatePrecisionClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'م' : 'ص';
      hours = hours % 12 || 12;

      document.getElementById('header-time-hm').textContent = `${hours}:${minutes}`;
      document.getElementById('header-time-sec').textContent = `:${seconds}`;
      document.getElementById('header-time-ampm').textContent = ampm;

      document.getElementById('zen-clock-hm').textContent = `${hours}:${minutes}`;
      document.getElementById('zen-clock-sec').textContent = `:${seconds} ${ampm}`;

      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('zen-date-pill').textContent = now.toLocaleDateString('ar-JO', dateOptions);
    }

    function toggleFullscreenMode() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    }

    function openZenClockMode() { document.getElementById('ambient-clock-overlay').classList.add('active'); }
    function closeZenClockMode() { document.getElementById('ambient-clock-overlay').classList.remove('active'); }

    // بدء التشغيل اللحظي
    setInterval(updatePrecisionClock, 1000);
    updatePrecisionClock();
    syncFlavorsAndPickup();
    setInterval(syncFlavorsAndPickup, 15000); // تحديث متزن للصالون كل 15 ثانية
  </script>
</body>
</html>
