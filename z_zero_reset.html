<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUFFY • لوفي | تصفير وتطهير المنظومة (Factory Reset)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Readex+Pro:wght@400;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-ar: 'Readex Pro', system-ui, sans-serif;
      --font-en: 'Plus Jakarta Sans', system-ui, sans-serif;
      --brand-red: #ff2a5f;
      --brand-gold: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-ar);
      background: radial-gradient(circle at 50% 20%, #2a080c 0%, #0d0405 100%);
      color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center;
    }
    .reset-card {
      background: rgba(255, 255, 255, 0.06); border: 2px solid #fda4af; border-radius: 28px;
      padding: 30px 20px; width: 100%; max-width: 440px; box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; gap: 14px;
    }
    .btn-reset-danger {
      background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%); color: #fff;
      border: none; padding: 14px; border-radius: 14px; font-family: var(--font-ar);
      font-size: 13.5px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4);
    }
    .btn-reset-danger:active { transform: scale(0.98); }
    input[type="password"] {
      width: 100%; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 12px; padding: 12px; color: #fff; text-align: center; font-family: var(--font-en); font-size: 13px; outline: none;
    }
  </style>
</head>
<body>

  <div class="reset-card">
    <div style="font-size:36px;">⚠️</div>
    <div style="font-size:17px; font-weight:900; color:#fecdd3;">تصفير وتطهير المنظومة للبدء الرسمي</div>
    <p style="font-size:11.5px; color:#cbd5e1; line-height:1.6;">
      سيتم مسح كافة الطلبات التجريبية، السائقين، النكهات، والمسحات التاريخية، والاحتفاظ بـ <strong>كلمة المرور التنفيذية وبطاقة المدير العام وساعات الدوام فقط</strong>.
    </p>

    <input type="password" id="pass-input" placeholder="كلمة المرور التنفيذية..." onkeypress="if(event.key==='Enter') executeReset()">

    <button class="btn-reset-danger" id="btn-run" onclick="executeReset()">
      <span>تصفير وتطهير المنظومة السحابية بالكامل ⚡</span>
    </button>
  </div>

  <script>
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxYmpfN2OBW24M-sumyx8dwbkFN-RsbiWkYJZYa0gZLfMxVpXr2TswzORV0inmu5nFieQ/exec";

    function executeReset() {
      const pass = document.getElementById('pass-input').value.trim();
      if (!pass) { alert("يرجى إدخال كلمة المرور"); return; }

      if (!confirm("هل أنت متأكد بنسبة 100% من تصفير المنظومة وبدء التشغيل التجاري الرسمي؟")) return;

      const btn = document.getElementById('btn-run');
      btn.disabled = true;
      btn.textContent = "جاري التطهير والتصفير الشامل... ⏳";

      const cb = "onResetDone_" + Date.now();
      window[cb] = function(res) {
        btn.disabled = false;
        if (res && res.status === "success") {
          alert("🎉 تمت عملية التصفير الشامل وتطهير الشيتات الأربعة بنجاح تام 100%!\nالمنظومة الآن بيضاء نقية وجاهزة للإنتاج الرسمي.\nيمكنك الآن حذف هذا الملف من GitHub بأمان.");
          btn.textContent = "تم التصفير بنجاح ✓";
        } else {
          alert("تعذر التصفير: " + (res ? res.message : "خطأ غير معروف"));
          btn.textContent = "إعادة المحاولة";
        }
      };

      const s = document.createElement("script");
      s.src = `${APPS_SCRIPT_EXEC_URL}?auth_pass=${encodeURIComponent(pass)}&action=system_factory_reset&callback=${cb}&_ts=${Date.now()}`;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
